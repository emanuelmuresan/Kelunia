name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: demo
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-kelunia.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-kelunia
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1:web:demo"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-kelunia.appspot.com
      # after build so next-env.d.ts exists
      - run: npx tsc --noEmit
      - run: npm test

  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Firestore rules tests
        run: npx firebase emulators:exec --project demo-kelunia --only firestore "npm run test:rules:full"
      - name: E2E smoke
        run: npx firebase emulators:exec --project demo-kelunia --only auth,firestore "node e2e/seed.mjs && npx playwright test"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
